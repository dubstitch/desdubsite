name: Portfolio visual QA
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'home.css'
      - 'home.js'
      - 'component-lab.html'
      - 'philosophy.html'
      - 'case-studies.html'
      - 'resume.html'
      - 'theme.css'
      - 'theme.js'
      - 'qa/**'
      - '.github/workflows/portfolio-visual-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  responsive-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser QA
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 @axe-core/playwright@4.11.0
          npx playwright install chromium webkit --with-deps
      - name: Serve portfolio
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/portfolio-http.log 2>&1 &
          echo $! > /tmp/portfolio-http.pid
          sleep 2
          curl -fsS http://127.0.0.1:8765/index.html >/dev/null
      - name: Verify responsive layouts and capture images
        run: node qa/portfolio-qa.mjs
